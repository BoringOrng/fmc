[package]
name = "fmc"
version = "0.1.0"
license-file = "LICENSE"
edition.workspace = true

[dependencies]
bevy = { workspace = true, features = ["default", "serialize", "file_watcher"] }
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
zstd.workspace = true
tar.workspace = true
crossbeam.workspace = true
rusqlite.workspace = true

fmc-protocol.workspace = true
fmc_noise.workspace = true

clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
wasmtime = "=46.0.1"
ureq = "3.5.0"
nonmax = "0.5.5"
bitflags = "2.13.2"

[target.'cfg(windows)'.dependencies]
junction = "2.0.0"

[build-dependencies]
tar.workspace = true
zstd.workspace = true

[lints]
workspace = true

[features]
dev_native = [
    "dev",
    "bevy/file_watcher",
    "bevy/embedded_watcher",
]

dev = [
    "bevy/debug",
    "bevy/dynamic_linking",
    "bevy/bevy_dev_tools",
    "bevy/bevy_ui_debug",
    "bevy/track_location",
]

[workspace]
resolver = "3"
members = ["crates/fmc-*"]
exclude = ["docs/examples"]

[workspace.package]
edition = "2024"

[workspace.lints.clippy.pedantic]
level = "warn"
priority = -1

[workspace.lints.clippy.nursery]
level = "warn"
priority = -1

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false }
serde ={ version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
zstd = "0.14.3"
bincode = "1.3.3"
crossbeam = { version = "0.5.15", package = "crossbeam-channel" }
rusqlite = { version = "0.34.0", features = ["bundled"] }

fmc_noise = "0.3.2"

fmc-protocol.path = "crates/fmc-protocol"
fmc-protocol-derive.path = "crates/fmc-protocol-derive"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"
