[package]
name = "fmc"
version = "0.1.0"
edition.workspace = true

[dependencies]
bevy.workspace = true
tracing.workspace = true

[lints]
workspace = true

[features]
default = ["dev_native"]

dev_native = [
    "dev",
    "bevy/file_watcher",
    "bevy/embedded_watcher",
]

dev = [
    "bevy/debug",
    "bevy/dynamic_linking",
    "bevy/bevy_dev_tools",
    "bevy/bevy_ui_debug",
    "bevy/track_location",
]

[workspace]
resolver = "3"
members = ["crates/fmc-*"]

[workspace.package]
edition = "2024"

[workspace.lints.clippy.pedantic]
level = "warn"
priority = -1

[workspace.lints.clippy.nursery]
level = "warn"
priority = -1

[workspace.lints.clippy]

[workspace.dependencies.bevy]
version = "0.20"
default-features = false
features = ["3d", "audio", "ui"]

[workspace.dependencies.tracing]
version = "0.1"
features = [
    "max_level_debug",
    "release_max_level_warn",
]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }

fmc-protocol.path = "crates/fmc-protocol"
fmc-protocol-derive.path = "crates/fmc-protocol-derive"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"
